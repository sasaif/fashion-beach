name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and unpack the MVP 1 build
        run: |
          set -euo pipefail
          mkdir -p _site
          cat packaged/fashion-beach-mvp-dist.zip.b64.part* > /tmp/fashion-beach-mvp-dist.zip.b64
          base64 -d /tmp/fashion-beach-mvp-dist.zip.b64 > /tmp/fashion-beach-mvp-dist.zip
          unzip -o /tmp/fashion-beach-mvp-dist.zip -d _site
          touch _site/.nojekyll
          test -f _site/index.html
          rm -f /tmp/fashion-beach-mvp-dist.zip /tmp/fashion-beach-mvp-dist.zip.b64

      - name: Decode and unpack the private test build (test-z30lyrb7)
        run: |
          set -euo pipefail
          # unlisted test build at /fashion-beach/test-z30lyrb7/ ; the MVP 1 root above stays byte-identical
          mkdir -p _site/test-z30lyrb7
          cat packaged/test-z30lyrb7/fashion-beach-test-z30lyrb7.zip.b64.part* > /tmp/test-build.zip.b64
          base64 -d /tmp/test-build.zip.b64 > /tmp/test-build.zip
          unzip -o /tmp/test-build.zip -d _site/test-z30lyrb7
          test -f _site/test-z30lyrb7/index.html
          printf 'User-agent: *\nDisallow: /fashion-beach/test-z30lyrb7/\n' > _site/robots.txt
          rm -f /tmp/test-build.zip /tmp/test-build.zip.b64

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
